<script>
        // URLs Base de Recursos en GitHub
        const URL_CSV_CATALOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/catalogo.csv';
        const URL_MP_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/mplogo.png';
        const URL_CARREFOUR_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/carrefourexpresslogo.webp';
        const URL_CUENTA_DNI_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/cuentadnilogo.jpg';
        
        // Banners de Viernes
        const URL_BANNER_VIERNES_SUP = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannerviernes_2.jpg';
        const URL_BANNER_VIERNES_INF = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannerviernesabajo_2.jpg';

        // Banners de Sábado y Domingo
        const URL_BANNER_SD_SUP = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannersabadoydomingo_2.jpg';
        const URL_BANNER_SD_INF = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannersabadoydomingoabajo_2.jpg';

        let catalogoProductos = {}; 
        let productosAEscanear = []; 
        let html5QrcodeScanner = null;
        let escanerActivo = false;

        window.addEventListener('DOMContentLoaded', () => {
            cargarCatalogoDesdeURL();
        });

        async function cargarCatalogoDesdeURL() {
            const statusDiv = document.getElementById('statusCatalogo');

            try {
                const respuesta = await fetch(URL_CSV_CATALOGO);
                if (!respuesta.ok) throw new Error("No se encontró el archivo catalogo.csv en GitHub");

                const text = await respuesta.text();
                const lineas = text.split('\n');
                catalogoProductos = {};
                let contador = 0;

                lineas.forEach((linea, idx) => {
                    if (idx === 0 || !linea.trim()) return; 
                    const cols = linea.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    
                    if (cols.length >= 2) {
                        const ean = cols[0];
                        catalogoProductos[ean] = {
                            ean: ean,
                            producto: cols[1] || "PRODUCTO",
                            descripcion: cols[2] || "",
                            aclaracion: cols[3] || "",
                            fotoUrl: cols[4] || `https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/${ean}.webp`
                        };
                        contador++;
                    }
                });

                statusDiv.innerHTML = `<span class="status-badge">✓ Catálogo online listo (${contador} productos)</span>`;
            } catch (error) {
                console.error("Error al cargar catálogo:", error);
                statusDiv.innerHTML = `<span style="color:red; font-size:0.85rem;">⚠️ Error al conectar con GitHub. Asegúrate de tener subido el archivo <b>catalogo.csv</b> en tu repositorio.</span>`;
            }
        }

        function alternarCamara() {
            const readerDiv = document.getElementById("reader");
            if (escanerActivo) { detenerCamara(); return; }

            readerDiv.style.display = "block";
            html5QrcodeScanner = new Html5Qrcode("reader");

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess
            ).catch(err => {
                alert("Error al abrir la cámara: " + err);
                readerDiv.style.display = "none";
            });

            escanerActivo = true;
        }

        function detenerCamara() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById("reader").style.display = "none";
                    escanerActivo = false;
                    html5QrcodeScanner = null;
                }).catch(err => console.log(err));
            }
        }

        function onScanSuccess(decodedText) {
            detenerCamara();
            procesarEAN(decodedText.trim());
        }

        function buscarEanManual() {
            const ean = document.getElementById('manualEanInput').value.trim();
            if (ean) {
                procesarEAN(ean);
                document.getElementById('manualEanInput').value = '';
            }
        }

        function procesarEAN(ean) {
            let productoBase = catalogoProductos[ean];

            // Si el EAN no existe o no cargó el catálogo, permite ingreso de nombre manual
            if (!productoBase) {
                const nombreManual = prompt(`El EAN ${ean} no existe en el catálogo online.\n\nIngresá el nombre del producto:`);
                if (!nombreManual) return;

                productoBase = {
                    ean: ean,
                    producto: nombreManual.toUpperCase(),
                    descripcion: "",
                    aclaracion: "",
                    fotoUrl: `https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/${ean}.webp`
                };
            }

            const precio = prompt(`Producto: ${productoBase.producto}\n\nIngresá el Precio Regular actual ($):`, "1000");
            
            if (precio !== null) {
                productosAEscanear.push({
                    ...productoBase,
                    precioRegular: parseFloat(precio) || 0
                });
                actualizarListaUI();
            }
        }

        function actualizarListaUI() {
            const contenedor = document.getElementById('listaEscaneados');
            document.getElementById('cantProductos').innerText = productosAEscanear.length;
            contenedor.innerHTML = '';

            productosAEscanear.forEach((p, idx) => {
                contenedor.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <strong>${p.producto}</strong>
                            <span>EAN: ${p.ean}</span>
                        </div>
                        <input type="number" class="item-price-input" value="${p.precioRegular}" 
                               onchange="productosAEscanear[${idx}].precioRegular = parseFloat(this.value) || 0">
                        <button class="btn-danger" onclick="eliminarProducto(${idx})">✕</button>
                    </div>
                `;
            });
        }

        function eliminarProducto(idx) {
            productosAEscanear.splice(idx, 1);
            actualizarListaUI();
        }

        function cargarImagen(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        // --- PLANTILLA 1: JUEVES (Mercado Pago - 15%) ---
        async function crearCartelJueves(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 15;

            const [imgProducto, imgMp, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_MP_LOGO),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            ctx.fillStyle = "#ffe600";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#001a72";
            ctx.font = "900 48px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY JUEVES CON", canvas.width / 2, 75);

            if (imgMp) {
                const w = 150, h = (imgMp.height / imgMp.width) * w;
                ctx.drawImage(imgMp, (canvas.width / 2) - (w / 2), 95, w, h);
            }

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(50, 190, 700, 630, 25);
            ctx.fill();
            ctx.stroke();

            if (imgCarrefour) {
                const w = 110, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 610, 210, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 290;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 340 - (h / 2), w, h);
            }

            if (pData.aclaracion) {
                ctx.fillStyle = "#000000";
                ctx.font = "bold 20px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(pData.aclaracion.toUpperCase(), canvas.width / 2, 510);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            const maxAncho = 310;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAncho && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " ";
                    y += 30;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 75, y);

            const posXCartel = 400, anchoCartel = 320; 
            const centroCartel = posXCartel + (anchoCartel / 2);
            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));
            const precioReg = Math.round(pData.precioRegular);

            ctx.fillStyle = "#e11d48";
            ctx.fillRect(posXCartel, 535, anchoCartel, 140);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 78px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("$" + precioFinal, centroCartel, 635);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("PRECIO REGULAR $" + precioReg, centroCartel, 710);

            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Abonando con QR desde el celular,", canvas.width / 2, 865);
            ctx.fillText("EXCLUSIVO DINERO EN CUENTA.", canvas.width / 2, 892);
            ctx.fillText("COMPRA MINIMA DE $15000", canvas.width / 2, 919);

            return canvas.toDataURL('image/png');
        }

        // --- PLANTILLA 2: MIÉRCOLES (Cuenta DNI - 10%) ---
        async function crearCartelMiercoles(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 10;

            const [imgProducto, imgCdni, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_CUENTA_DNI_LOGO),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            ctx.fillStyle = "#77c210";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#1e1c6b";
            ctx.font = "900 48px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY MIÉRCOLES CON", canvas.width / 2, 75);

            if (imgCdni) {
                const w = 340, h = (imgCdni.height / imgCdni.width) * w;
                ctx.drawImage(imgCdni, (canvas.width / 2) - (w / 2), 95, w, h);
            }

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(50, 190, 700, 630, 25);
            ctx.fill();
            ctx.stroke();

            if (imgCarrefour) {
                const w = 110, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 610, 210, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 290;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 340 - (h / 2), w, h);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            const maxAncho = 320;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAncho && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " ";
                    y += 30;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 75, y);

            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));
            const precioReg = Math.round(pData.precioRegular);

            ctx.fillStyle = "#ff0000";
            ctx.font = "bold 82px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("$" + precioFinal, 560, 635);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("PRECIO REGULAR $" + precioReg, 560, 695);

            ctx.fillStyle = "#1e1c6b";
            ctx.font = "900 32px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("EXCLUSIVO ABONANDO", canvas.width / 2, 870);
            ctx.fillText("CON CUENTA DNI", canvas.width / 2, 910);

            return canvas.toDataURL('image/png');
        }

        // --- PLANTILLA 3: VIERNES (Cuenta Digital - 15%) ---
        async function crearCartelViernes(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 15;

            const [imgProducto, imgBannerSup, imgBannerInf, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_BANNER_VIERNES_SUP),
                cargarImagen(URL_BANNER_VIERNES_INF),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2e3d92');
            gradient.addColorStop(0.4, '#4d2371');
            gradient.addColorStop(1, '#621a68');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (imgBannerSup) {
                ctx.drawImage(imgBannerSup, 0, 0, canvas.width, 230);
            }

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(80, 240, 640, 570, 25);
            ctx.fill();
            ctx.stroke();

            if (imgCarrefour) {
                const w = 120, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 580, 260, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 460, imgMaxH = 310;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 400 - (h / 2), w, h);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 23px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            const maxAncho = 310;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAncho && n > 0) {
                    ctx.fillText(linea, 110, y);
                    linea = palabras[n] + " ";
                    y += 28;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 110, y);

            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));
            const precioReg = Math.round(pData.precioRegular);

            ctx.fillStyle = "#6b21a8";
            ctx.font = "bold 84px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("$" + precioFinal, 680, 645);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("PRECIO REGULAR $" + precioReg, 680, 700);

            if (imgBannerInf) {
                const altoBanner = 145;
                const posicionY = 825;
                ctx.drawImage(imgBannerInf, 0, posicionY, canvas.width, altoBanner);
            }

            return canvas.toDataURL('image/png');
        }

        // --- PLANTILLA 4: SÁBADO Y DOMINGO (Cuenta Digital - 10%) ---
        async function crearCartelSabadoDomingo(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 10;

            const [imgProducto, imgBannerSup, imgBannerInf, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_BANNER_SD_SUP),
                cargarImagen(URL_BANNER_SD_INF),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1c2d82');
            gradient.addColorStop(0.5, '#432371');
            gradient.addColorStop(1, '#862569');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (imgBannerSup) {
                ctx.drawImage(imgBannerSup, 0, 0, canvas.width, 230);
            }

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(90, 240, 620, 580, 25);
            ctx.fill();
            ctx.stroke();

            if (imgCarrefour) {
                const w = 120, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 560, 260, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 400, imgMaxH = 260;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 380 - (h / 2), w, h);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            const maxAncho = 300;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAncho && n > 0) {
                    ctx.fillText(linea, 110, y);
                    linea = palabras[n] + " ";
                    y += 30;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 110, y);

            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));
            const precioReg = Math.round(pData.precioRegular);

            ctx.fillStyle = "#6b21a8";
            ctx.font = "bold 82px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("$" + precioFinal, 670, 640);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("PRECIO REGULAR $" + precioReg, 670, 700);

            if (imgBannerInf) {
                const altoBanner = 145;
                const posicionY = 825;
                ctx.drawImage(imgBannerInf, 0, posicionY, canvas.width, altoBanner);
            }

            return canvas.toDataURL('image/png');
        }

        async function generarTodasLasOfertas() {
            if (productosAEscanear.length === 0) {
                alert("Escaneá al menos un producto primero.");
                return;
            }

            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = 'Generando carteles...';

            const tipoPromocion = document.getElementById('tipoPromocionSelect').value;
            const fragment = document.createDocumentFragment();

            for (let p of productosAEscanear) {
                let urlResult;
                if (tipoPromocion === 'miercoles') {
                    urlResult = await crearCartelMiercoles(p);
                } else if (tipoPromocion === 'viernes') {
                    urlResult = await crearCartelViernes(p);
                } else if (tipoPromocion === 'sabadoDomingo') {
                    urlResult = await crearCartelSabadoDomingo(p);
                } else {
                    urlResult = await crearCartelJueves(p);
                }

                if (urlResult) {
                    const img = document.createElement('img');
                    img.src = urlResult;
                    fragment.appendChild(img);
                }
            }

            previewGrid.innerHTML = '';
            previewGrid.appendChild(fragment);
        }
    </script>
