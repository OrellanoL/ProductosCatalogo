<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Carteleria</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-gray: #f4f4f5;
            --border-color: #e4e4e7;
            --primary: #001a72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            padding: 15px;
            color: #18181b;
        }

        .card {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .subtitle {
            color: #71717a;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .section-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }

        .flex-gap {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-camera { background: #0284c7; color: white; width: 100%; }
        .btn-manual { background: #3b82f6; color: white; }
        .btn-calc { background: #000; color: white; flex: 1; }
        .btn-print { background: #e4e4e7; color: #18181b; flex: 1; }
        .btn-danger { background: #ef4444; color: white; padding: 6px 10px; font-size: 0.8rem; }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .scanned-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .item-info { flex: 2; min-width: 180px; }
        .item-info strong { display: block; font-size: 0.9rem; }
        .item-info span { font-size: 0.8rem; color: #666; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #32164d;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        .select-promo-item {
            font-size: 0.8rem !important;
            padding: 6px !important;
            width: auto !important;
        }

        .item-price-input {
            width: 100px !important;
            text-align: right;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .preview-grid img {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: bold;
            color: #15803d;
            background: #dcfce7;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            @page { size: A4 portrait; margin: 0; }
            .preview-grid { display: block !important; }
