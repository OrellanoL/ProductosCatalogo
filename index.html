<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Carteleria</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-gray: #f4f4f5;
            --border-color: #e4e4e7;
            --primary: #001a72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            padding: 15px;
            color: #18181b;
        }

        .card {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .subtitle {
            color: #71717a;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .section-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }

        .flex-gap {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-camera { background: #0284c7; color: white; width: 100%; }
        .btn-manual { background: #3b82f6; color: white; }
        .btn-calc { background: #000; color: white; flex: 1; }
        .btn-print { background: #e4e4e7; color: #18181b; flex: 1; }
        .btn-danger { background: #ef4444; color: white; padding: 6px 10px; font-size: 0.8rem; }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .scanned-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .item-info { flex: 2; min-width: 180px; }
        .item-info strong { display: block; font-size: 0.9rem; }
        .item-info span { font-size: 0.8rem; color: #666; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #32164d;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        .select-promo-item {
            font-size: 0.8rem !important;
            padding: 6px !important;
            width: auto !important;
        }

        .item-price-input {
            width: 100px !important;
            text-align: right;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .preview-grid img {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: bold;
            color: #15803d;
            background: #dcfce7;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            @page { size: A4 portrait; margin: 0; }
            .preview-grid { display: block !important; }
            .preview-grid img {
                display: block;
                page-break-after: always;
                page-break-inside: avoid;
                width: 100%;
                max-height: 100vh;
                object-fit: contain;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="card no-print">
        <h1>📱 Generador de carteleria - </h1>
        <p class="subtitle">Catálogo sincronizado desde GitHub en tiempo real. Creada por Ludmila - Sugerencias: orellanoludmila@hotmail.com</p>

        <div class="section-box">
            <label>Estado del Catálogo:</label>
            <div id="statusCatalogo">⏳ Cargando catálogo online...</div>
        </div>

        <div class="section-box">
            <div class="flex-gap" style="margin-bottom: 12px;">
                <div style="flex: 1;">
                    <label>Seleccionar Día / Formato:</label>
                    <select id="tipoPromocionSelect">
                        <option value="martes">Martes - Tarjeta Crédito Carrefour (20%)</option>
                        <option value="miercoles">Miércoles - Cuenta DNI (10%)</option>
                        <option value="jueves">Jueves - Mercado Pago (15%)</option>
                        <option value="viernes">Viernes - Cuenta Digital (15%)</option>
                        <option value="sabadoDomingo" selected>Sábado y Domingo - Cuenta Digital (10%)</option>
                        <option value="mayores60">Mayores de 60 / ANSES (10%)</option>
                    </select>
                </div>
            </div>

            <button class="btn-camera" onclick="alternarCamara()">📷 Escanear Producto con Cámara</button>
            <div id="reader"></div>

            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
                <label>📋 Seleccionar producto del catálogo:</label>
                <div class="flex-gap" style="margin-bottom: 12px;">
                    <select id="selectCatalogo" onchange="seleccionarDesdeDesplegable()" style="flex: 1;">
                        <option value="">-- Buscar / Elegir producto de la lista --</option>
                    </select>
                </div>

                <label>O ingresar EAN manualmente:</label>
                <div class="flex-gap">
                    <input type="text" id="manualEanInput" placeholder="Ej: 7792180144829" style="flex: 1;">
                    <button class="btn-manual" onclick="buscarEanManual()">Buscar</button>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="margin: 0;">Productos seleccionados hoy (<span id="cantProductos">0</span>):</label>
            <button class="btn-danger" style="padding: 6px 12px; font-size: 0.85rem;" onclick="vaciarListaCompleta()">🗑 Vaciar Lista</button>
        </div>
        <div class="scanned-list" id="listaEscaneados"></div>

        <div class="flex-gap" style="margin-top: 20px;">
            <button class="btn-calc" onclick="generarTodasLasOfertas()">⚡ Generar Carteles</button>
            <button class="btn-print" onclick="imprimirPC()">🖨 Imprimir (PC)</button>
            <button class="btn-manual" style="background: #16a34a;" onclick="descargarPDF()">📥 Descargar PDF (Móvil / PC)</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <script>
        const URL_CSV_CATALOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/catalogo.csv';
        const URL_MP_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/mplogo.png';
        const URL_CARREFOUR_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/carrefourexpresslogo.webp';
        const URL_CUENTA_DNI_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/cuentadnilogo.jpg';
        const URL_MI_CARREFOUR_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/micarrefour.jpg';

        const URL_PROMO_50 = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/2doal50.jpg';
        const URL_PROMO_70 = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/2doal70.jpg';
        const URL_TARJETA_CREDITO_CARREFOUR = "https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/tarjetacreditocarrefour.png";
        const URL_BANNER_TARJETA_CREDITO = "https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannertarjetacredito.jpg";
        const URL_EXCLUSIVO_CUENTA_DIGITAL = "https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/exclusivocuentadigital.jpg";
        const URL_DESCARGAR_APP = "https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/DescargarApp.jpg";

        let catalogoProductos = {}; 
        let productosAEscanear = []; 
        let html5QrcodeScanner = null;
        let escanerActivo = false;

        function formatearPrecio(valor) {
            return Math.round(valor).toString();
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarCatalogoDesdeURL();
            recuperarListaGuardada();
        });

        function guardarListaEnStorage() {
            localStorage.setItem('productosAEscanear', JSON.stringify(productosAEscanear));
        }

        function recuperarListaGuardada() {
            const datosGuardados = localStorage.getItem('productosAEscanear');
            if (datosGuardados) {
                try {
                    productosAEscanear = JSON.parse(datosGuardados);
                    actualizarListaUI();
                } catch (e) {
                    console.error("Error al recuperar la lista guardada", e);
                }
            }
        }

        function vaciarListaCompleta() {
            if (confirm("¿Querés borrar todos los productos escaneados?")) {
                productosAEscanear = [];
                localStorage.removeItem('productosAEscanear');
                actualizarListaUI();
                document.getElementById('previewGrid').innerHTML = '';
            }
        }

        async function cargarCatalogoDesdeURL() {
            const statusDiv = document.getElementById('statusCatalogo');
            const selectCatalogo = document.getElementById('selectCatalogo');

            try {
                const respuesta = await fetch(URL_CSV_CATALOGO);
                if (!respuesta.ok) throw new Error("No se encontró el archivo catalogo.csv en GitHub");

                const text = await respuesta.text();
                const lineas = text.split('\n');
                catalogoProductos = {};
                
                let listaProcesada = [];

                lineas.forEach((linea, idx) => {
                    if (idx === 0 || !linea.trim()) return; 
                    const cols = linea.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    
                    if (cols.length >= 2) {
                        const ean = cols[0];
                        const nombreProducto = cols[1] || "PRODUCTO";

                        catalogoProductos[ean] = {
                            ean: ean,
                            producto: nombreProducto,
                            fotoUrl: cols[4] || `https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/${ean}.webp`
                        };

                        listaProcesada.push({
                            ean: ean,
                            producto: nombreProducto
                        });
                    }
                });

                listaProcesada.sort((a, b) => a.producto.localeCompare(b.producto, 'es', { sensitivity: 'base' }));

                const fragmento = document.createDocumentFragment();

                const opcInicial = document.createElement('option');
                opcInicial.value = "";
                opcInicial.textContent = "-- Buscar / Elegir producto de la lista --";
                fragmento.appendChild(opcInicial);

                listaProcesada.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.ean;
                    option.textContent = `${item.producto} (${item.ean})`;
                    fragmento.appendChild(option);
                });

                selectCatalogo.innerHTML = '';
                selectCatalogo.appendChild(fragmento);

                statusDiv.innerHTML = `<span class="status-badge">✓ Catálogo online listo (${listaProcesada.length} productos)</span>`;
            } catch (error) {
                statusDiv.innerHTML = `<span style="color:red; font-size:0.85rem;">⚠️ Error al conectar con GitHub.</span>`;
            }
        }

        function seleccionarDesdeDesplegable() {
            const select = document.getElementById('selectCatalogo');
            const eanSeleccionado = select.value;

            if (eanSeleccionado) {
                procesarEAN(eanSeleccionado);
                select.value = "";
            }
        }

        function alternarCamara() {
            const readerDiv = document.getElementById("reader");
            if (escanerActivo) { detenerCamara(); return; }

            readerDiv.style.display = "block";
            html5QrcodeScanner = new Html5Qrcode("reader");

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess
            ).catch(err => {
                alert("Error al abrir la cámara: " + err);
                readerDiv.style.display = "none";
            });

            escanerActivo = true;
        }

        function detenerCamara() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById("reader").style.display = "none";
                    escanerActivo = false;
                    html5QrcodeScanner = null;
                });
            }
        }

        function onScanSuccess(decodedText) {
            detenerCamara();
            procesarEAN(decodedText.trim());
        }

        function buscarEanManual() {
            const ean = document.getElementById('manualEanInput').value.trim();
            if (ean) {
                procesarEAN(ean);
                document.getElementById('manualEanInput').value = '';
            }
        }

        function procesarEAN(ean) {
            let productoBase = catalogoProductos[ean];

            if (!productoBase) {
                const nombreManual = prompt(`El EAN ${ean} no existe en el catálogo.\n\nIngresá el nombre:`);
                if (!nombreManual) return;

                productoBase = {
                    ean: ean,
                    producto: nombreManual.toUpperCase(),
                    fotoUrl: `https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/${ean}.webp`
                };
            }

            const precio = prompt(`Producto: ${productoBase.producto}\n\nIngresá el Precio Regular actual ($):`, "1000");
            if (precio === null) return;

            productosAEscanear.push({
                ...productoBase,
                precioRegular: parseFloat(precio.replace(',', '.')) || 0,
                esMiCarrefour: false,
                promocionSegunda: 'ninguna'
            });

            guardarListaEnStorage();
            actualizarListaUI();
        }

        function actualizarListaUI() {
            const contenedor = document.getElementById('listaEscaneados');
            document.getElementById('cantProductos').innerText = productosAEscanear.length;
            contenedor.innerHTML = '';

            productosAEscanear.forEach((p, idx) => {
                contenedor.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <strong>${p.producto}</strong>
                            <span>EAN: ${p.ean}</span>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" ${p.esMiCarrefour ? 'checked' : ''} 
                                   onchange="productosAEscanear[${idx}].esMiCarrefour = this.checked; guardarListaEnStorage();">
                            Mi Carrefour
                        </label>
                        <div>
                            <select class="select-promo-item" onchange="productosAEscanear[${idx}].promocionSegunda = this.value; guardarListaEnStorage();">
                                <option value="ninguna" ${p.promocionSegunda === 'ninguna' ? 'selected' : ''}>Sin Promo 2do</option>
                                <option value="50" ${p.promocionSegunda === '50' ? 'selected' : ''}>2do al 50%</option>
                                <option value="70" ${p.promocionSegunda === '70' ? 'selected' : ''}>2do al 70%</option>
                            </select>
                        </div>
                        <input type="number" step="0.01" class="item-price-input" value="${p.precioRegular}" 
                               onchange="productosAEscanear[${idx}].precioRegular = parseFloat(this.value) || 0; guardarListaEnStorage();">
                        <button class="btn-danger" onclick="eliminarProducto(${idx})">✕</button>
                    </div>
                `;
            });
        }

        function eliminarProducto(idx) {
            productosAEscanear.splice(idx, 1);
            guardarListaEnStorage();
            actualizarListaUI();
        }

        function cargarImagen(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        // --- DIBUJAR CUADRO PRECIO CON PARÁMETRO PARA FINDE O VIERNES ---
        function dibujarCuadroPrecio(ctx, x, y, ancho, alto, precioFinalNum, pData, imgMiCarrefour, esJueves = false, esFindeOViernes = false) {
            const textoPrecio = "$" + formatearPrecio(precioFinalNum);
            const esMiCarrefour = pData.esMiCarrefour;
            const tienePromo2do = pData.promocionSegunda && pData.promocionSegunda !== 'ninguna';

            if (tienePromo2do) {
                ctx.fillStyle = "#000000";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("LLEVANDO 2 UNIDADES PAGÁS C/U:", x + (ancho / 2), y - 8);
            }

            if (esMiCarrefour) {
                const colorMorado = "#633166";
                const anchoBarraLogo = Math.round(ancho * 0.28);
                const anchoCajaBlanca = ancho - anchoBarraLogo;

                ctx.fillStyle = colorMorado;
                ctx.fillRect(x, y, ancho, alto);

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x + anchoBarraLogo, y + 4, anchoCajaBlanca - 4, alto - 8);

                if (imgMiCarrefour) {
                    const margin = 8;
                    const maxW = anchoBarraLogo - margin;
                    const maxH = alto - margin;
                    let scale = Math.min(maxW / imgMiCarrefour.width, maxH / imgMiCarrefour.height);
                    let w = imgMiCarrefour.width * scale;
                    let h = imgMiCarrefour.height * scale;
                    ctx.drawImage(imgMiCarrefour, x + (anchoBarraLogo - w) / 2, y + (alto - h) / 2, w, h);
                }

                ctx.fillStyle = colorMorado;
                let fontSize = 54;
                if (textoPrecio.length > 8) fontSize = 42;
                if (textoPrecio.length > 10) fontSize = 36;
                
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText(textoPrecio, x + anchoBarraLogo + (anchoCajaBlanca / 2), y + (alto / 2) + (fontSize / 3));

            } else {
                let fontSize = 70;
                if (textoPrecio.length > 8) fontSize = 55;
                if (textoPrecio.length > 10) fontSize = 45;

                if (esJueves) {
                    ctx.fillStyle = "#ffe600";
                    ctx.fillRect(x, y, ancho, alto);

                    ctx.fillStyle = "#001a72";
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(textoPrecio, x + (ancho / 2), y + (alto / 2) + (fontSize / 3));
                } else {
                    ctx.fillStyle = "#1e1c6b";
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(textoPrecio, x + (ancho / 2), y + (alto / 2) + (fontSize / 3));
                }

                // Si es viernes o finde, el borde es #B80F56; de lo contrario celeste #00a3e0
                ctx.strokeStyle = esFindeOViernes ? "#B80F56" : "#00a3e0";
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, ancho, alto);   
            }
        }

        function calcularPrecioFinal(pData, pctDia) {
            let base = pData.precioRegular;
            
            if (pData.promocionSegunda === '50') {
                base = base * 0.75; 
            } else if (pData.promocionSegunda === '70') {
                base = base * 0.65; 
            }

            return base * (1 - pctDia / 100);
        }

        async function dibujarCucardaPromo(ctx, promocionSegunda, x = 30, y = 30, ancho = 270) {
            if (!promocionSegunda || promocionSegunda === 'ninguna') return;

            let urlImagen = null;
            if (promocionSegunda === '50') urlImagen = URL_PROMO_50;
            if (promocionSegunda === '70') urlImagen = URL_PROMO_70;

            if (urlImagen) {
                const imgPromo = await cargarImagen(urlImagen);
                if (imgPromo) {
                    const alto = (imgPromo.height / imgPromo.width) * ancho;
                    ctx.drawImage(imgPromo, x, y, ancho, alto);
                }
            }
        }
       
        async function crearCartelMartes(pData) {
    const canvas = document.createElement('canvas');
    canvas.width = 800; 
    canvas.height = 980;
    const ctx = canvas.getContext('2d');
    
    // Porcentaje configurado para Martes
    const pctDescuento = 20;

    const [
        imgProducto, 
        imgCarrefour, 
        imgMiCarrefour,
        imgExclusivo,
        imgDescargarApp,
        imgBannerTarjetaCredito // Carga agregada para evitar ReferenceError
    ] = await Promise.all([
        cargarImagen(pData.fotoUrl),
        cargarImagen(URL_CARREFOUR_LOGO),
        cargarImagen(URL_MI_CARREFOUR_LOGO),
        cargarImagen(URL_EXCLUSIVO_CUENTA_DIGITAL),
        cargarImagen(URL_DESCARGAR_APP),
        cargarImagen(URL_BANNER_TARJETA_CREDITO) // Asegúrate de tener definida esta constante
    ]);

    // Fondo principal
    const gradiente = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradiente.addColorStop(0.0, "#2B0038");
    gradiente.addColorStop(0.35, "#800B53");
    gradiente.addColorStop(0.70, "#B80F56");
    gradiente.addColorStop(1.0, "#4A0033");

    ctx.fillStyle = gradiente;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Banner Superior
    const xBanner = 50;
    const yBanner = 20;
    const wBanner = 700;
    const hBanner = 145;
    const rBanner = 18;

    const fondoGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            fondoGrad.addColorStop(0, '#3b2382');
            fondoGrad.addColorStop(0.5, '#20639b');
            fondoGrad.addColorStop(1, '#34d1b8');
            ctx.fillStyle = fondoGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);


    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Píldora "Todos los Martes"
    const wPill = 295;
    const hPill = 34;
    const xPill = xBanner + wBanner - wPill - 25;
    const yPill = yBanner + 12;

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.roundRect(xPill, yPill, wPill, hPill, 17);
    ctx.fill();

    ctx.fillStyle = "#20639b";
    ctx.font = "bold 21px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Todos los Martes", xPill + (wPill / 2), yPill + (hPill / 2));

    // Texto de Descuento (20%)
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    const textoPct = pctDescuento.toString(); // "20"
    ctx.font = "italic 900 115px 'Impact', 'Arial Black', sans-serif";
    const xDiez = xBanner + 20;
    const yDiez = yBanner + 122;
    ctx.fillText(textoPct, xDiez, yDiez);

    // Ajuste dinámico de posición según el ancho real del texto "20"
    const anchoTextoPct = ctx.measureText(textoPct).width;

            const precioFinal = calcularPrecioFinal(pData, pctDescuento);
            // Pasar esFindeOViernes = true para activar el color #B80F56
            dibujarCuadroPrecio(ctx, 430, 530, 290, 125, precioFinal, pData, imgMiCarrefour, false, true);
            
            await dibujarCucardaPromo(ctx, pData.promocionSegunda, 90, 195, 155);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PRECIO REGULAR $" + formatearPrecio(pData.precioRegular), 575, 695);

            const anchoPildora = 590;
            const altoPildora = 45;
            const xPildora = (canvas.width - anchoPildora) / 2;
            const yPildora = 730;
            const radioPildora = 22;

            ctx.save();
            ctx.fillStyle = "#B80F56";
            ctx.beginPath();
            ctx.roundRect(xPildora, yPildora, anchoPildora, altoPildora, radioPildora);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("¡ACUMULABLE CON TODAS LAS PROMOS!", canvas.width / 2, yPildora + (altoPildora / 2));
            ctx.restore();

            ctx.fillStyle = "#000000";
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("NO INCLUYE ELECTRO,CARNICERIA, FRUTAS, VERDURAS, BAZAR Y TEXTIL", canvas.width / 2, 790);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("(*)Ver legales en bancodeserviciosfinancieros.com.ar/legales", 390, 965);

            const xPie = 30;
            const yPie = 825;
            const wPie = 740;
            const hPie = 125;

            const altoPieza = 115;
            const yPieza = yPie + (hPie - altoPieza) / 2;
            const radioPieza = 14;

            if (imgExclusivo && imgDescargarApp) {
                const anchoExcl = (imgExclusivo.width / imgExclusivo.height) * altoPieza;
                const anchoApp = (imgDescargarApp.width / imgDescargarApp.height) * altoPieza;
                const anchoTotalPieza = anchoExcl + anchoApp;
                const xPieza = xPie + (wPie - anchoTotalPieza) / 2;

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(xPieza + anchoExcl, yPieza, anchoApp, altoPieza, [0, radioPieza, radioPieza, 0]);
                ctx.fill();

                ctx.save();
                ctx.beginPath();
                ctx.roundRect(xPieza, yPieza, anchoExcl, altoPieza, [radioPieza, 0, 0, radioPieza]);
                ctx.clip();
                ctx.drawImage(imgExclusivo, xPieza, yPieza, anchoExcl, altoPieza);
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.roundRect(xPieza + anchoExcl, yPieza, anchoApp, altoPieza, [0, radioPieza, radioPieza, 0]);
                ctx.clip();
                ctx.drawImage(imgDescargarApp, xPieza + anchoExcl, yPieza, anchoApp, altoPieza);
                ctx.restore();

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(xPieza, yPieza, anchoTotalPieza, altoPieza, radioPieza);
                ctx.stroke();
            }

            return canvas.toDataURL('image/png');
        }

        async function generarTodasLasOfertas() {
            if (productosAEscanear.length === 0) {
                alert("Escaneá al menos un producto primero.");
                return;
            }

            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = 'Generando carteles...';

            const tipoPromocion = document.getElementById('tipoPromocionSelect').value;
            const fragment = document.createDocumentFragment();

            for (let p of productosAEscanear) {
                let urlResult;
                if (tipoPromocion === 'martes') {
                    urlResult = await crearCartelMartes(p);
                } else if (tipoPromocion === 'miercoles') {
                    urlResult = await crearCartelMiercoles(p);
                } else if (tipoPromocion === 'jueves') {
                    urlResult = await crearCartelJueves(p);
                } else if (tipoPromocion === 'viernes') {
                    urlResult = await crearCartelViernes(p);
                } else if (tipoPromocion === 'sabadoDomingo') {
                    urlResult = await crearCartelFinDeSemana(p);
                } else if (tipoPromocion === 'mayores60') {
                    urlResult = await crearCartelMayores60(p);
                }

                if (urlResult) {
                    const img = document.createElement('img');
                    img.src = urlResult;
                    fragment.appendChild(img);
                }
            }

            previewGrid.innerHTML = '';
            previewGrid.appendChild(fragment);
        }

        function imprimirPC() {
            const imagenes = document.querySelectorAll('#previewGrid img');
            if (imagenes.length === 0) {
                alert("Primero debes generar los carteles.");
                return;
            }

            const ventanaImpresion = window.open('', '_blank');
            if (!ventanaImpresion) {
                alert("Por favor, permite las ventanas emergentes (pop-ups).");
                return;
            }

            let htmlContenido = `
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Imprimir Carteles</title>
                    <style>
                        @page { size: A4 portrait; margin: 0; }
                        body { margin: 0; padding: 0; background: white; }
                        img { 
                            width: 100vw; height: 100vh; 
                            object-fit: contain; 
                            page-break-after: always; 
                            page-break-inside: avoid;
                            display: block;
                        }
                    </style>
                </head>
                <body>
            `;

            imagenes.forEach(img => { htmlContenido += `<img src="${img.src}">`; });

            htmlContenido += `
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                window.focus();
                                window.print();
                            }, 250);
                        };
                        window.onafterprint = function() { window.close(); };
                    <\/script>
                </body>
                </html>
            `;

            ventanaImpresion.document.open();
            ventanaImpresion.document.write(htmlContenido);
            ventanaImpresion.document.close();
        }

        async function descargarPDF() {
            const imagenes = document.querySelectorAll('#previewGrid img');
            if (imagenes.length === 0) {
                alert("Primero debes generar los carteles.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pdfAncho = doc.internal.pageSize.getWidth();
            const pdfAlto = doc.internal.pageSize.getHeight();

            for (let i = 0; i < imagenes.length; i++) {
                if (i > 0) doc.addPage();
                doc.addImage(imagenes[i].src, 'PNG', 0, 0, pdfAncho, pdfAlto);
            }

            doc.save('carteles_ofertas.pdf');
        }
    </script>
