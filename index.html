<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Carteles de Ofertas - Carrefour Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white shadow-lg py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-tags"></i> Generador de Carteles de Oferta
            </h1>
            <span class="bg-blue-700 px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase">Carrefour Express</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Panel de Control / Formulario (Columna Izquierda) -->
        <section class="lg:col-span-5 bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit space-y-6">
            <h2 class="text-xl font-bold text-slate-700 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-600"></i> Configuración de Cartel
            </h2>

            <!-- Selector de Día / Promoción -->
            <div>
                <label for="tipoPromocionSelect" class="block text-sm font-bold text-slate-700 mb-2">
                    Seleccionar Promoción del Día:
                </label>
                <select id="tipoPromocionSelect" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                    <option value="miercoles">Miércoles - Cuenta DNI (10%)</option>
                    <option value="jueves">Jueves - Mercado Pago (15%)</option>
                    <option value="viernes" selected>Viernes - Cuenta Digital (15%)</option>
                </select>
            </div>

            <hr class="border-slate-200">

            <!-- Datos del Producto -->
            <div class="space-y-4">
                <h3 class="font-bold text-slate-600 text-sm tracking-wider uppercase">Datos del Producto</h3>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre / Descripción del Producto</label>
                    <input type="text" id="inputProducto" value="BISCOCHOS SALADOS" placeholder="Ej: YERBA MATE PLAYADITO" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Aclaración / Gramaje (Opcional)</label>
                    <input type="text" id="inputAclaracion" value="''DON SATUR'' BOLSA X 200 GRS" placeholder="Ej: BOLSA X 500 GRS" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Precio Regular ($)</label>
                        <input type="number" id="inputPrecio" value="1200" placeholder="1200" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">URL Foto Producto</label>
                        <input type="text" id="inputFoto" value="https://via.placeholder.com/400" placeholder="https://..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-xs">
                    </div>
                </div>
            </div>

            <!-- Botón de Generar -->
            <button onclick="generarCartel()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2 text-lg">
                <i class="fa-solid fa-bolt"></i> ⚡ Generar Cartel
            </button>
        </section>

        <!-- Vista Previa / Resultado (Columna Derecha) -->
        <section class="lg:col-span-7 bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col items-center justify-center min-h-[500px]">
            <h2 class="text-xl font-bold text-slate-700 border-b pb-3 w-full mb-6 flex items-center gap-2">
                <i class="fa-solid fa-image text-blue-600"></i> Vista Previa del Cartel
            </h2>

            <!-- Contenedor del Preview -->
            <div id="previewContainer" class="relative max-w-[450px] w-full flex justify-center items-center min-h-[400px] border-2 border-dashed border-slate-300 rounded-xl p-4 bg-slate-50">
                <p id="placeholderText" class="text-slate-400 font-medium text-center">Hacé clic en "Generar Cartel" para visualizar la imagen</p>
                <img id="cartelResultado" class="hidden w-full h-auto rounded-lg shadow-xl border border-slate-200" alt="Cartel Generado">
            </div>

            <!-- Acciones para descargar -->
            <div id="accionesDescarga" class="hidden mt-6 w-full max-w-[450px] flex gap-4">
                <a id="btnDescargar" download="cartel_oferta.png" href="#" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow text-center transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Descargar Imagen
                </a>
            </div>
        </section>

    </main>

    <script>
        // --- RECURSOS DE IMÁGENES BASE ---
        const URL_CARREFOUR_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/carrefourexpresslogo.webp';
        const URL_CUENTA_DNI_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/cuentadni.png';
        const URL_BANNER_VIERNES_TOP = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannerviernes.jpg';
        const URL_BANNER_VIERNES_BOTTOM = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannerviernesabajo.png';

        // Helper para cargar imágenes en Canvas con promesas
        function cargarImagen(url) {
            return new Promise((resolve) => {
                if (!url) resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        // --- PLANTILLA 1: MIÉRCOLES (Cuenta DNI - 10%) ---
        async function crearCartelMiercoles(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 10;

            const [imgProducto, imgCdni, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_CUENTA_DNI_LOGO),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            // 1. Fondo verde oficial
            ctx.fillStyle = "#77c210";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Texto del encabezado
            ctx.fillStyle = "#1e1c6b";
            ctx.font = "900 48px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY MIÉRCOLES CON", canvas.width / 2, 75);

            // 3. Logo único de Cuenta DNI + Banco Provincia
            if (imgCdni) {
                const w = 340, h = (imgCdni.height / imgCdni.width) * w;
                ctx.drawImage(imgCdni, (canvas.width / 2) - (w / 2), 95, w, h);
            }

            // 4. Recuadro blanco central
            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(50, 190, 700, 630, 25);
            ctx.fill();
            ctx.stroke();

            // 5. Logo Carrefour Express
            if (imgCarrefour) {
                const w = 110, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 610, 210, w, h);
            }

            // 6. Imagen del producto
            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 290;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 340 - (h / 2), w, h);
            }

            // 7. Nombre / Descripción del producto
            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            const maxAncho = 320;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAncho && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " ";
                    y += 30;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 75, y);

            if (pData.aclaracion) {
                ctx.font = "bold 18px sans-serif";
                ctx.fillStyle = "#4b5563";
                ctx.fillText(pData.aclaracion.toUpperCase(), 75, y + 30);
            }

            // 8. Precios
            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));
            const precioReg = Math.round(pData.precioRegular);

            // Precio Oferta en rojo
            ctx.fillStyle = "#ff0000";
            ctx.font = "bold 82px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("$" + precioFinal, 560, 635);

            // Precio Regular en negro
            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("PRECIO REGULAR $" + precioReg, 560, 695);

            // 9. Pie de página
            ctx.fillStyle = "#1e1c6b";
            ctx.font = "900 32px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("EXCLUSIVO ABONANDO", canvas.width / 2, 870);
            ctx.fillText("CON CUENTA DNI", canvas.width / 2, 910);

            return canvas.toDataURL('image/png');
        }

        // --- PLANTILLA 2: JUEVES (Mercado Pago - 15%) ---
        async function crearCartelJueves(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 15;

            const [imgProducto, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            // 1. Fondo Amarillo Mercado Pago
            ctx.fillStyle = "#ffe600";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Encabezado
            ctx.fillStyle = "#000000";
            ctx.font = "900 44px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY JUEVES CON", canvas.width / 2, 70);

            ctx.fillStyle = "#009ee3";
            ctx.font = "900 40px sans-serif";
            ctx.fillText("MERCADO PAGO", canvas.width / 2, 120);

            // 3. Recuadro blanco central
            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#009ee3";
            ctx.beginPath();
            ctx.roundRect(50, 150, 700, 670, 25);
            ctx.fill();
            ctx.stroke();

            // 4. Logo Carrefour
            if (imgCarrefour) {
                const w = 110, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 610, 170, w, h);
            }

            // 5. Imagen del producto
            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 310;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 330 - (h / 2), w, h);
            }

            // 6. Descripción
            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570;
            const maxAncho = 320;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAncho && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " ";
                    y += 30;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 75, y);

            if (pData.aclaracion) {
                ctx.font = "bold 18px sans-serif";
                ctx.fillStyle = "#4b5563";
                ctx.fillText(pData.aclaracion.toUpperCase(), 75, y + 30);
            }

            // 7. Precios
            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));
            const precioReg = Math.round(pData.precioRegular);

            ctx.fillStyle = "#009ee3";
            ctx.font = "bold 82px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("$" + precioFinal, 560, 635);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("PRECIO REGULAR $" + precioReg, 560, 695);

            // 8. Pie de página
            ctx.fillStyle = "#000000";
            ctx.font = "900 30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("EXCLUSIVO ABONANDO CON QR", canvas.width / 2, 875);
            ctx.fillText("DESDE LA APP DE MERCADO PAGO", canvas.width / 2, 915);

            return canvas.toDataURL('image/png');
        }

        // --- PLANTILLA 3: VIERNES (Cuenta Digital - 15% Fijo) ---
        async function crearCartelViernes(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 15;

            const [imgProducto, imgBannerTop, imgBannerBottom] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_BANNER_VIERNES_TOP),
                cargarImagen(URL_BANNER_VIERNES_BOTTOM)
            ]);

            // 1. Fondo degradado
            const gradiente = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradiente.addColorStop(0, '#1b2c85');
            gradiente.addColorStop(0.3, '#8c3270');
            gradiente.addColorStop(0.7, '#2c2878');
            gradiente.addColorStop(1, '#192372');

            ctx.fillStyle = gradiente;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Banner Superior
            let topBannerHeight = 220;
            if (imgBannerTop) {
                topBannerHeight = (imgBannerTop.height / imgBannerTop.width) * canvas.width;
                ctx.drawImage(imgBannerTop, 0, 0, canvas.width, topBannerHeight);
            }

            // 3. Banner Inferior
            let bottomBannerHeight = 150;
            let bottomY = canvas.height - bottomBannerHeight;
            if (imgBannerBottom) {
                bottomBannerHeight = (imgBannerBottom.height / imgBannerBottom.width) * canvas.width;
                bottomY = canvas.height - bottomBannerHeight;
                ctx.drawImage(imgBannerBottom, 0, bottomY, canvas.width, bottomBannerHeight);
            }

            // 4. Recuadro Blanco Central
            const rectX = 50;
            const rectY = topBannerHeight + 20;
            const rectWidth = 700;
            const rectHeight = bottomY - rectY - 20;

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(rectX, rectY, rectWidth, rectHeight, 25);
            ctx.fill();
            ctx.stroke();

            // 5. Imagen del Producto
            if (imgProducto) {
                const imgMaxW = 420;
                const imgMaxH = rectHeight * 0.45;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale;
                let h = imgProducto.height * scale;

                ctx.drawImage(imgProducto, (canvas.width - w) / 2, rectY + 25, w, h);
            }

            // 6. Nombre / Descripción del Producto
            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", textY = rectY + (rectHeight * 0.65);
            const maxAnchoTexto = 330;
            const textX = rectX + 35;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > maxAnchoTexto && n > 0) {
                    ctx.fillText(linea, textX, textY);
                    linea = palabras[n] + " ";
                    textY += 30;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, textX, textY);

            if (pData.aclaracion) {
                ctx.font = "bold 18px sans-serif";
                ctx.fillStyle = "#4b5563";
                ctx.fillText(pData.aclaracion.toUpperCase(), textX, textY + 30);
            }

            // 7. Precios
            const precioReg = Math.round(pData.precioRegular);
            const precioFinal = Math.round(pData.precioRegular * (1 - pctDescuento / 100));

            const precioX = rectX + rectWidth - 180;
            const precioY = rectY + (rectHeight * 0.72);

            ctx.fillStyle = "#6b21a8";
            ctx.font = "bold 76px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("$" + precioFinal, precioX, precioY);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("PRECIO REGULAR $" + precioReg, precioX, precioY + 40);

            return canvas.toDataURL('image/png');
        }

        // --- CONTROLADOR PRINCIPAL ---
        async function generarCartel() {
            const tipoPromocion = document.getElementById('tipoPromocionSelect').value;
            
            const productoData = {
                producto: document.getElementById('inputProducto').value.trim() || 'PRODUCTO SIN NOMBRE',
                aclaracion: document.getElementById('inputAclaracion').value.trim(),
                precioRegular: parseFloat(document.getElementById('inputPrecio').value) || 0,
                fotoUrl: document.getElementById('inputFoto').value.trim()
            };

            let dataUrl = '';

            if (tipoPromocion === 'miercoles') {
                dataUrl = await crearCartelMiercoles(productoData);
            } else if (tipoPromocion === 'jueves') {
                dataUrl = await crearCartelJueves(productoData);
            } else if (tipoPromocion === 'viernes') {
                dataUrl = await crearCartelViernes(productoData);
            }

            // Mostrar el resultado
            const imgEl = document.getElementById('cartelResultado');
            const placeholder = document.getElementById('placeholderText');
            const btnDescargar = document.getElementById('btnDescargar');
            const contenedorAcciones = document.getElementById('accionesDescarga');

            imgEl.src = dataUrl;
            imgEl.classList.remove('hidden');
            placeholder.classList.add('hidden');
            
            btnDescargar.href = dataUrl;
            btnDescargar.download = `cartel_${tipoPromocion}_${productoData.producto.replace(/\s+/g, '_').toLowerCase()}.png`;
            contenedorAcciones.classList.remove('hidden');
        }
    </script>
</body>
</html>
