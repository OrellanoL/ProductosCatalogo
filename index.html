<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Carteleria</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-gray: #f4f4f5;
            --border-color: #e4e4e7;
            --primary: #001a72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            padding: 15px;
            color: #18181b;
        }

        .card {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .subtitle {
            color: #71717a;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .section-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }

        .flex-gap {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-camera { background: #0284c7; color: white; width: 100%; }
        .btn-manual { background: #3b82f6; color: white; }
        .btn-calc { background: #000; color: white; flex: 1; }
        .btn-print { background: #e4e4e7; color: #18181b; flex: 1; }
        .btn-danger { background: #ef4444; color: white; padding: 6px 10px; font-size: 0.8rem; }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .scanned-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .item-info { flex: 2; min-width: 180px; }
        .item-info strong { display: block; font-size: 0.9rem; }
        .item-info span { font-size: 0.8rem; color: #666; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #32164d;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        .select-promo-item {
            font-size: 0.8rem !important;
            padding: 6px !important;
            width: auto !important;
        }

        .item-price-input {
            width: 100px !important;
            text-align: right;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .preview-grid img {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: bold;
            color: #15803d;
            background: #dcfce7;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            @page { size: A4 portrait; margin: 0; }
            .preview-grid { display: block !important; }
            .preview-grid img {
                display: block;
                page-break-after: always;
                page-break-inside: avoid;
                width: 100%;
                max-height: 100vh;
                object-fit: contain;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="card no-print">
        <h1>📱 Generador de carteleria - </h1>
        <p class="subtitle">Catálogo sincronizado desde GitHub en tiempo real. Creada por Ludmila</p>

        <div class="section-box">
            <label>Estado del Catálogo:</label>
            <div id="statusCatalogo">⏳ Cargando catálogo online...</div>
        </div>

        <div class="section-box">
            <div class="flex-gap" style="margin-bottom: 12px;">
                <div style="flex: 1;">
                    <label>Seleccionar Día / Formato:</label>
                    <select id="tipoPromocionSelect">
                        <option value="miercoles">Miércoles - Cuenta DNI (10%)</option>
                        <option value="jueves">Jueves - Mercado Pago (15%)</option>
                        <option value="viernes">Viernes - Cuenta Digital (15%)</option>
                        <option value="sabadoDomingo" selected>Sábado y Domingo - Cuenta Digital (10%)</option>
                    </select>
                </div>
            </div>

            <button class="btn-camera" onclick="alternarCamara()">📷 Escanear Producto con Cámara</button>
            <div id="reader"></div>

            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
                <label>O ingresar EAN manualmente:</label>
                <div class="flex-gap">
                    <input type="text" id="manualEanInput" placeholder="Ej: 7792180144829" style="flex: 1;">
                    <button class="btn-manual" onclick="buscarEanManual()">Buscar</button>
                </div>
            </div>
        </div>

        <label>Productos seleccionados hoy (<span id="cantProductos">0</span>):</label>
        <div class="scanned-list" id="listaEscaneados"></div>

        <div class="flex-gap" style="margin-top: 20px;">
            <button class="btn-calc" onclick="generarTodasLasOfertas()">⚡ Generar Carteles</button>
            <button class="btn-print" onclick="imprimirPC()">🖨 Imprimir (PC)</button>
            <button class="btn-manual" style="background: #16a34a;" onclick="descargarPDF()">📥 Descargar PDF (Móvil / PC)</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <script>
        const URL_CSV_CATALOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/catalogo.csv';
        const URL_MP_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/mplogo.png';
        const URL_CARREFOUR_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/carrefourexpresslogo.webp';
        const URL_CUENTA_DNI_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/cuentadnilogo.jpg';
        const URL_MI_CARREFOUR_LOGO = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/micarrefour.jpg';
        
        const URL_BANNER_VIERNES_SUP = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannerviernes_2.jpg';
        const URL_BANNER_VIERNES_INF = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannerviernesabajo_2.jpg';
        const URL_BANNER_SD_SUP = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannersabadoydomingo_2.jpg';
        const URL_BANNER_SD_INF = 'https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/bannersabadoydomingobajo_2.jpg';

        let catalogoProductos = {}; 
        let productosAEscanear = []; 
        let html5QrcodeScanner = null;
        let escanerActivo = false;

        //function formatearPrecio(valor) {
            //return new Intl.NumberFormat('es-AR', {
              //  minimumFractionDigits: 0,
            //    maximumFractionDigits: 2
          //  }).format(valor);
        //}
        function formatearPrecio(valor) {
            return Math.round(valor).toString();
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarCatalogoDesdeURL();
        });

        async function cargarCatalogoDesdeURL() {
            const statusDiv = document.getElementById('statusCatalogo');
            try {
                const respuesta = await fetch(URL_CSV_CATALOGO);
                if (!respuesta.ok) throw new Error("No se encontró el archivo catalogo.csv en GitHub");

                const text = await respuesta.text();
                const lineas = text.split('\n');
                catalogoProductos = {};
                let contador = 0;

                lineas.forEach((linea, idx) => {
                    if (idx === 0 || !linea.trim()) return; 
                    const cols = linea.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    
                    if (cols.length >= 2) {
                        const ean = cols[0];
                        catalogoProductos[ean] = {
                            ean: ean,
                            producto: cols[1] || "PRODUCTO",
                            fotoUrl: cols[4] || `https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/${ean}.webp`
                        };
                        contador++;
                    }
                });

                statusDiv.innerHTML = `<span class="status-badge">✓ Catálogo online listo (${contador} productos)</span>`;
            } catch (error) {
                statusDiv.innerHTML = `<span style="color:red; font-size:0.85rem;">⚠️ Error al conectar con GitHub.</span>`;
            }
        }

        function alternarCamara() {
            const readerDiv = document.getElementById("reader");
            if (escanerActivo) { detenerCamara(); return; }

            readerDiv.style.display = "block";
            html5QrcodeScanner = new Html5Qrcode("reader");

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess
            ).catch(err => {
                alert("Error al abrir la cámara: " + err);
                readerDiv.style.display = "none";
            });

            escanerActivo = true;
        }

        function detenerCamara() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById("reader").style.display = "none";
                    escanerActivo = false;
                    html5QrcodeScanner = null;
                });
            }
        }

        function onScanSuccess(decodedText) {
            detenerCamara();
            procesarEAN(decodedText.trim());
        }

        function buscarEanManual() {
            const ean = document.getElementById('manualEanInput').value.trim();
            if (ean) {
                procesarEAN(ean);
                document.getElementById('manualEanInput').value = '';
            }
        }

        function procesarEAN(ean) {
            let productoBase = catalogoProductos[ean];

            if (!productoBase) {
                const nombreManual = prompt(`El EAN ${ean} no existe en el catálogo.\n\nIngresá el nombre:`);
                if (!nombreManual) return;

                productoBase = {
                    ean: ean,
                    producto: nombreManual.toUpperCase(),
                    fotoUrl: `https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/${ean}.webp`
                };
            }

            const precio = prompt(`Producto: ${productoBase.producto}\n\nIngresá el Precio Regular actual ($):`, "1000");
            if (precio === null) return;

            productosAEscanear.push({
                ...productoBase,
                precioRegular: parseFloat(precio.replace(',', '.')) || 0,
                esMiCarrefour: false,
                promocionSegunda: 'ninguna' // opciones: 'ninguna', '50', '70'
            });
            actualizarListaUI();
        }

        function actualizarListaUI() {
            const contenedor = document.getElementById('listaEscaneados');
            document.getElementById('cantProductos').innerText = productosAEscanear.length;
            contenedor.innerHTML = '';

            productosAEscanear.forEach((p, idx) => {
                contenedor.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <strong>${p.producto}</strong>
                            <span>EAN: ${p.ean}</span>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" ${p.esMiCarrefour ? 'checked' : ''} 
                                   onchange="productosAEscanear[${idx}].esMiCarrefour = this.checked">
                            Mi Carrefour
                        </label>
                        <div>
                            <select class="select-promo-item" onchange="productosAEscanear[${idx}].promocionSegunda = this.value">
                                <option value="ninguna" ${p.promocionSegunda === 'ninguna' ? 'selected' : ''}>Sin Promo 2do</option>
                                <option value="50" ${p.promocionSegunda === '50' ? 'selected' : ''}>2do al 50%</option>
                                <option value="70" ${p.promocionSegunda === '70' ? 'selected' : ''}>2do al 70%</option>
                            </select>
                        </div>
                        <input type="number" step="0.01" class="item-price-input" value="${p.precioRegular}" 
                               onchange="productosAEscanear[${idx}].precioRegular = parseFloat(this.value) || 0">
                        <button class="btn-danger" onclick="eliminarProducto(${idx})">✕</button>
                    </div>
                `;
            });
        }

        function eliminarProducto(idx) {
            productosAEscanear.splice(idx, 1);
            actualizarListaUI();
        }

        function cargarImagen(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        // =========================================================
        // DIBUJA EL CUADRO DE PRECIO CON TEXTO DE "LLEVANDO 2" SI APLICA
        // =========================================================
        function dibujarCuadroPrecio(ctx, x, y, ancho, alto, precioFinalNum, pData, imgMiCarrefour, esJueves = false) {
            const textoPrecio = "$" + formatearPrecio(precioFinalNum);
            const esMiCarrefour = pData.esMiCarrefour;
            const tienePromo2do = pData.promocionSegunda && pData.promocionSegunda !== 'ninguna';

            // Aclaración "LLEVANDO 2 PAGÁS C/U" arriba de la caja
            if (tienePromo2do) {
                ctx.fillStyle = "#000000";
                ctx.font = "bold 15px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("LLEVANDO 2 UNIDADES PAGÁS C/U:", x + (ancho / 2), y - 10);
            }

            if (esMiCarrefour) {
                const colorMorado = "#32164d";
                const anchoBarraLogo = Math.round(ancho * 0.28);
                const anchoCajaBlanca = ancho - anchoBarraLogo;

                ctx.fillStyle = colorMorado;
                ctx.fillRect(x, y, ancho, alto);

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x + anchoBarraLogo, y + 4, anchoCajaBlanca - 4, alto - 8);

                if (imgMiCarrefour) {
                    const margin = 8;
                    const maxW = anchoBarraLogo - margin;
                    const maxH = alto - margin;
                    let scale = Math.min(maxW / imgMiCarrefour.width, maxH / imgMiCarrefour.height);
                    let w = imgMiCarrefour.width * scale;
                    let h = imgMiCarrefour.height * scale;
                    ctx.drawImage(imgMiCarrefour, x + (anchoBarraLogo - w) / 2, y + (alto - h) / 2, w, h);
                }

                ctx.fillStyle = colorMorado;
                let fontSize = 54;
                if (textoPrecio.length > 8) fontSize = 42;
                if (textoPrecio.length > 10) fontSize = 36;
                
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText(textoPrecio, x + anchoBarraLogo + (anchoCajaBlanca / 2), y + (alto / 2) + (fontSize / 3));

            } else {
                let fontSize = 70;
                if (textoPrecio.length > 8) fontSize = 55;
                if (textoPrecio.length > 10) fontSize = 45;

                // SI ES JUEVES: Recuadro rojo con letras blancas
                if (esJueves) {
                    ctx.fillStyle = "#ff0000";
                    ctx.fillRect(x, y, ancho, alto);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(textoPrecio, x + (ancho / 2), y + (alto / 2) + (fontSize / 3));
                } else {
                    // OTROS DÍAS: Solo texto en rojo sin fondo
                    ctx.fillStyle = "#ff0000";
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(textoPrecio, x + (ancho / 2), y + (alto / 2) + (fontSize / 3));
                }
            }
        }
        // FUNCIÓN CÁLCULO DE DESCUENTOS COMBINADOS
        function calcularPrecioFinal(pData, pctDia) {
            let base = pData.precioRegular;
            
            // Si tiene promo 2do tildada, calcula el promedio unitario (50% = 25% desc, 70% = 35% desc)
            if (pData.promocionSegunda === '50') {
                base = base * 0.75; 
            } else if (pData.promocionSegunda === '70') {
                base = base * 0.65; 
            }

            // Luego aplica el descuento del día seleccinado
            return base * (1 - pctDia / 100);
        }

        // =========================================================
        // PLANTILLAS DE CARTEL
        // =========================================================

        async function crearCartelJueves(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 15;

            const [imgProducto, imgMp, imgCarrefour, imgMiCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_MP_LOGO),
                cargarImagen(URL_CARREFOUR_LOGO),
                cargarImagen(URL_MI_CARREFOUR_LOGO)
            ]);

            ctx.fillStyle = "#ffe600";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#001a72";
            ctx.font = "900 48px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY JUEVES CON", canvas.width / 2, 75);

            if (imgMp) {
                const w = 150, h = (imgMp.height / imgMp.width) * w;
                ctx.drawImage(imgMp, (canvas.width / 2) - (w / 2), 95, w, h);
            }

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(50, 190, 700, 630, 25);
            ctx.fill(); ctx.stroke();

            if (imgCarrefour) {
                const w = 110, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 610, 210, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 290;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 340 - (h / 2), w, h);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > 310 && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " "; y += 30;
                } else { linea = testLinea; }
            }
            ctx.fillText(linea, 75, y);

            const precioFinal = calcularPrecioFinal(pData, pctDescuento);

            dibujarCuadroPrecio(ctx, 430, 535, 290, 125, precioFinal, pData, imgMiCarrefour, true);
            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PRECIO REGULAR $" + formatearPrecio(pData.precioRegular), 575, 700);

            ctx.font = "bold 22px sans-serif";
            ctx.fillText("Abonando con QR desde el celular,", canvas.width / 2, 865);
            ctx.fillText("EXCLUSIVO DINERO EN CUENTA.", canvas.width / 2, 892);
            ctx.fillText("VÁLIDO PARA COMPRAS SUPERIORES A $15000.", canvas.width / 2, 919);

            return canvas.toDataURL('image/png');
        }

        async function crearCartelMiercoles(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 10;

            const [imgProducto, imgCdni, imgCarrefour, imgMiCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_CUENTA_DNI_LOGO),
                cargarImagen(URL_CARREFOUR_LOGO),
                cargarImagen(URL_MI_CARREFOUR_LOGO)
            ]);

            ctx.fillStyle = "#77c210";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#1e1c6b";
            ctx.font = "900 48px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY MIÉRCOLES CON", canvas.width / 2, 75);

            if (imgCdni) {
                const w = 340, h = (imgCdni.height / imgCdni.width) * w;
                ctx.drawImage(imgCdni, (canvas.width / 2) - (w / 2), 95, w, h);
            }

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4; ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(50, 190, 700, 630, 25);
            ctx.fill(); ctx.stroke();

            if (imgCarrefour) {
                const w = 110, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 610, 210, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 290;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 340 - (h / 2), w, h);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 24px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 570; 
            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > 320 && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " "; y += 30;
                } else { linea = testLinea; }
            }
            ctx.fillText(linea, 75, y);

            const precioFinal = calcularPrecioFinal(pData, pctDescuento);

            dibujarCuadroPrecio(ctx, 430, 535, 290, 125, precioFinal, pData, imgMiCarrefour);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PRECIO REGULAR $" + formatearPrecio(pData.precioRegular), 575, 695);

            ctx.fillStyle = "#1e1c6b";
            ctx.font = "900 32px sans-serif";
            ctx.fillText("EXCLUSIVO ABONANDO CON CUENTA DNI", canvas.width / 2, 890);
            ctx.fillText("VÁLIDO PARA COMPRAS", canvas.width / 2, 917);
            ctx.fillText("SUPERIORES A $15000", canvas.width / 2, 944);



            return canvas.toDataURL('image/png');
        }

        async function crearCartelViernes(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 980;
            const ctx = canvas.getContext('2d');
            const pctDescuento = 15;

            const [imgProducto, imgViernesSup, imgViernesInf, imgCarrefour, imgMiCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_BANNER_VIERNES_SUP),
                cargarImagen(URL_BANNER_VIERNES_INF),
                cargarImagen(URL_CARREFOUR_LOGO),
                cargarImagen(URL_MI_CARREFOUR_LOGO)
            ]);

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2e3d92');
            gradient.addColorStop(1, '#621a68');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (imgViernesSup) ctx.drawImage(imgViernesSup, 0, 0, canvas.width, 220);

            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4; ctx.strokeStyle = "#00a3e0";
            ctx.beginPath();
            ctx.roundRect(80, 235, 640, 560, 25);
            ctx.fill(); ctx.stroke();

            if (imgCarrefour) {
                const w = 120, h = (imgCarrefour.height / imgCarrefour.width) * w;
                ctx.drawImage(imgCarrefour, 580, 255, w, h);
            }

            if (imgProducto) {
                const imgMaxW = 440, imgMaxH = 280;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale, h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 385 - (h / 2), w, h);
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";
            ctx.font = "bold 23px sans-serif";

            const palabras = pData.producto.split(" ");
            let linea = "", y = 560; 
            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                if (ctx.measureText(testLinea).width > 310 && n > 0) {
                    ctx.fillText(linea, 110, y);
                    linea = palabras[n] + " "; y += 28;
                } else { linea = testLinea; }
            }
            ctx.fillText(linea, 110, y);

            const precioFinal = calcularPrecioFinal(pData, pctDescuento);

            dibujarCuadroPrecio(ctx, 400, 530, 290, 125, precioFinal, pData, imgMiCarrefour);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PRECIO REGULAR $" + formatearPrecio(pData.precioRegular), 545, 690);

            if (imgViernesInf) ctx.drawImage(imgViernesInf, 0, 810, canvas.width, 170);

            return canvas.toDataURL('image/png');
        }

        async function generarTodasLasOfertas() {
            if (productosAEscanear.length === 0) {
                alert("Escaneá al menos un producto primero.");
                return;
            }

            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = 'Generando carteles...';

            const tipoPromocion = document.getElementById('tipoPromocionSelect').value;
            const fragment = document.createDocumentFragment();

            for (let p of productosAEscanear) {
                let urlResult;
                if (tipoPromocion === 'miercoles') {
                    urlResult = await crearCartelMiercoles(p);
                } else if (tipoPromocion === 'viernes') {
                    urlResult = await crearCartelViernes(p);
                } else if (tipoPromocion === 'sabadoDomingo') {
                    urlResult = await crearCartelSabadoDomingo(p);
                } else {
                    urlResult = await crearCartelJueves(p);
                }

                if (urlResult) {
                    const img = document.createElement('img');
                    img.src = urlResult;
                    fragment.appendChild(img);
                }
            }

            previewGrid.innerHTML = '';
            previewGrid.appendChild(fragment);
        }

        function imprimirPC() {
            const imagenes = document.querySelectorAll('#previewGrid img');
            if (imagenes.length === 0) {
                alert("Primero debes generar los carteles.");
                return;
            }

            const ventanaImpresion = window.open('', '_blank');
            if (!ventanaImpresion) {
                alert("Por favor, permite las ventanas emergentes (pop-ups).");
                return;
            }

            let htmlContenido = `
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Imprimir Carteles</title>
                    <style>
                        @page { size: A4 portrait; margin: 0; }
                        body { margin: 0; padding: 0; background: white; }
                        img { 
                            width: 100vw; height: 100vh; 
                            object-fit: contain; 
                            page-break-after: always; 
                            page-break-inside: avoid;
                            display: block;
                        }
                    </style>
                </head>
                <body>
            `;

            imagenes.forEach(img => { htmlContenido += `<img src="${img.src}">`; });

            htmlContenido += `
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                window.focus();
                                window.print();
                            }, 250);
                        };
                        window.onafterprint = function() { window.close(); };
                    <\/script>
                </body>
                </html>
            `;

            ventanaImpresion.document.open();
            ventanaImpresion.document.write(htmlContenido);
            ventanaImpresion.document.close();
        }

        async function descargarPDF() {
            const imagenes = document.querySelectorAll('#previewGrid img');
            if (imagenes.length === 0) {
                alert("Primero debes generar los carteles.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pdfAncho = doc.internal.pageSize.getWidth();
            const pdfAlto = doc.internal.pageSize.getHeight();

            for (let i = 0; i < imagenes.length; i++) {
                if (i > 0) doc.addPage();
                doc.addImage(imagenes[i].src, 'PNG', 0, 0, pdfAncho, pdfAlto);
            }

            doc.save('carteles_ofertas.pdf');
        }
    </script>
